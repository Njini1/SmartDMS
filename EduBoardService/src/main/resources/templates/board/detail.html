<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ko">
<head>
    <meta charset="UTF-8">
    <title th:text="${board.title}">게시글 상세보기 | SmartDMS</title>

    <!-- CSRF -->
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/board-detail.css}">
</head>

<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container board-detail mt-5">
    <!-- 게시글 제목 -->
    <div class="board-header mb-3">
        <h3 class="board-title" th:text="${board.title}"></h3>
        <div class="board-info text-muted">
            <span th:text="'작성자: ' + ${board.author}"></span> |
            <span th:text="${board.createdDate}"></span>
        </div>
    </div>

    <!-- 좋아요 버튼 -->
    <div class="d-flex align-items-center justify-content-between mb-3">
        <div></div>
        <div>
            <button id="like-btn"
                    class="btn p-0 border-0 bg-transparent"
                    th:attr="data-board-id=${board.boardId}, data-logged-in=${loginUser != null ? 'true' : 'false'}">
                <span id="like-icon"
                      th:text="${board.liked} ? '❤️' : '🤍'"
                      th:style="${board.liked} ? 'color:red;font-size:1.5rem;' : 'color:gray;font-size:1.5rem;'"></span>
            </button>
            <span id="like-count" th:text="${board.likeCount}"></span> 명이 좋아합니다
        </div>
    </div>

    <!-- 본문 -->
    <div class="board-content-wrapper">
        <p th:text="${board.content}" class="board-content"></p>
    </div>

    <div class="text-end mt-4 button-group">
        <a th:href="@{/board/list}" class="btn btn-outline-secondary me-2">목록으로</a>

        <!-- 작성자만 보이도록 -->
        <span th:if="${loginUser != null and loginUser.nickname == board.author}">
        <a th:href="@{|/board/${board.boardId}/updateForm|}" class="btn btn-main me-2">수정</a>

            <!-- 삭제 버튼 -->
        <form th:action="@{|/board/${board.boardId}/delete|}" method="post" style="display:inline;">
            <input type="hidden" name="_csrf" th:value="${_csrf.token}">
            <button type="submit" class="btn btn-danger"
                    onclick="return confirm('정말 이 게시글을 삭제하시겠습니까?');">삭제</button>
        </form>
    </span>
    </div>

    <hr class="divider"/>

    <!-- 댓글 목록 -->
    <section id="comments">
        <h5 class="fw-semibold mb-3">댓글</h5>

        <div th:each="c : ${comments}"
             th:class="'comment ' + (${c.parentCommentId} != null ? 'reply' : '')"
             th:attr="data-comment-id=${c.commentId}">

            <!-- 삭제된 댓글 -->
            <div th:if="${c.status == 'DELETED'}">
                <em class="text-muted">삭제된 댓글입니다.</em>
            </div>

            <!-- 활성 댓글 -->
            <div th:if="${c.status == 'ACTIVE'}">
                <div class="comment-header">
                    <strong th:text="${c.author}"></strong>
                    <span class="text-muted small" th:text="${c.createdDate}"></span>
                </div>
                <div class="comment-body">
                    <span th:if="${c.parentNickname != null}" class="text-primary fw-semibold">
                        @<span th:text="${c.parentNickname}"></span>&nbsp;
                    </span>
                    <span th:text="${c.content}"></span>
                </div>

                <div class="comment-actions">
                    <a href="javascript:void(0)" class="reply-btn"
                       th:attr="data-id=${c.commentId},data-user=${c.author}">답글</a>
                    <span th:if="${loginUser != null and loginUser.nickname == c.author}">
                        <a href="javascript:void(0)"
                           th:attr="data-id=${c.commentId},data-content=${c.content}"
                           class="edit-btn">수정</a>
                        <form th:action="@{|/comment/${c.commentId}/delete|}" method="post" style="display:inline;">
                            <input type="hidden" name="boardId" th:value="${board.boardId}">
                            <button type="submit" class="delete-btn">삭제</button>
                        </form>
                    </span>
                </div>
            </div>
        </div>
    </section>

    <hr class="divider"/>

    <!-- 댓글 입력 -->
    <section id="comment-form">
        <!-- 로그인 상태 -->
        <form th:if="${loginUser != null}"
              th:action="@{|/comment/${board.boardId}|}" method="post" id="formComment">
            <input type="hidden" name="parentCommentId" id="parentCommentId"/>
            <textarea name="content" id="content" rows="3" class="form-control"
                      placeholder="댓글을 입력하세요."></textarea>
            <div class="mt-2">
                <button type="submit" class="btn btn-main">등록</button>
                <button type="button" id="cancel-reply" class="btn btn-outline-secondary" style="display:none;">답글 취소</button>
            </div>
        </form>

        <!-- 비로그인 상태 -->
        <div th:if="${loginUser == null}">
            <textarea rows="3" cols="60" class="form-control" placeholder="댓글을 입력하려면 로그인하세요" disabled></textarea>
            <div class="mt-2">
                <button type="button" class="btn btn-main"
                        onclick="alert('로그인 후 이용 가능합니다.')">등록</button>
            </div>
        </div>
    </section>

</div>

<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", () => {
        const token = document.querySelector('meta[name="_csrf"]').content;
        const header = document.querySelector('meta[name="_csrf_header"]').content;

        // ❤️ 좋아요
        const likeBtn = document.getElementById("like-btn");
        if (likeBtn) {
            likeBtn.addEventListener("click", () => {
                if (likeBtn.dataset.loggedIn !== "true") return alert("로그인 후 이용 가능합니다.");
                const boardId = likeBtn.dataset.boardId;

                fetch(`/like/${boardId}/toggle`, {
                    method: "POST",
                    headers: { [header]: token, "X-Requested-With": "XMLHttpRequest" }
                })
                    .then(res => res.json())
                    .then(data => {
                        if (!data.success) return alert(data.message);
                        const icon = document.getElementById("like-icon");
                        const count = document.getElementById("like-count");
                        icon.textContent = data.liked ? "❤️" : "🤍";
                        icon.style.color = data.liked ? "red" : "gray";
                        count.textContent = data.likeCount;
                    });
            });
        }

        // 로그인 여부 (Thymeleaf에서 실제 값 주입)
        const isLoggedIn = /*[[${loginUser != null}]]*/ false;

        // 답글 폼
        const baseForm = document.getElementById("formComment");
        document.querySelectorAll(".reply-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                // 로그인 안 되어 있으면 알림
                if (!isLoggedIn) {
                    alert("로그인 후 이용 가능합니다.");
                    return;
                }

                // 기존 열려있는 폼 닫기
                const existingForm = document.querySelector(".inline-reply-form");
                if (existingForm) existingForm.remove();

                // 답글 폼 복제
                const commentDiv = btn.closest(".comment");
                const replyForm = baseForm.cloneNode(true);
                replyForm.classList.add("inline-reply-form");
                replyForm.querySelector("#parentCommentId").value = btn.dataset.id;
                replyForm.querySelector("#content").value = "@" + btn.dataset.user + " ";

                // 취소 버튼 표시
                const cancelBtn = replyForm.querySelector("#cancel-reply");
                cancelBtn.style.display = "inline-block";
                cancelBtn.addEventListener("click", () => replyForm.remove());

                // 삽입
                commentDiv.insertAdjacentElement("afterend", replyForm);
                replyForm.querySelector("#content").focus();
            });
        });

        // 댓글 수정 폼
        document.querySelectorAll(".edit-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                const commentDiv = btn.closest(".comment");
                const actions = commentDiv.querySelector(".comment-actions");
                const body = commentDiv.querySelector(".comment-body");
                const commentId = btn.dataset.id;
                const currentContent = btn.dataset.content;

                const existing = commentDiv.querySelector(".inline-edit-form");
                if (existing) existing.remove();

                const editForm = document.createElement("form");
                editForm.classList.add("inline-edit-form");
                editForm.method = "post";
                editForm.action = `/comment/${commentId}/update`;
                editForm.innerHTML = `
                    <input type="hidden" name="_csrf" value="${token}">
                    <input type="hidden" name="boardId" value="[[${board.boardId}]]">
                    <textarea name="newContent" rows="3" class="form-control mb-2">${currentContent}</textarea>
                    <button type="submit" class="btn btn-sm btn-main">수정 완료</button>
                    <button type="button" class="btn btn-sm btn-secondary cancel-edit">취소</button>
                `;

                actions.insertAdjacentElement("afterend", editForm);
                body.style.display = "none";
                actions.style.display = "none";

                editForm.querySelector(".cancel-edit").addEventListener("click", () => {
                    editForm.remove();
                    body.style.display = "block";
                    actions.style.display = "block";
                });
            });
        });
    });
</script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
