<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{main :: layout(
        '게시글 등록 | SmartDMS',
        ~{::content},
        ~{::extraCss},
        ~{::extraJs}
      )}">

<head></head>
<body>

<!-- 이 페이지 전용 CSS (board-form.css) -->
<th:block th:fragment="extraCss">
    <link rel="stylesheet" th:href="@{/css/board-form.css}">
</th:block>

<th:block th:fragment="extraJs">
    <!-- 등록 페이지는 별도 JS 없음 -->
</th:block>

<th:block th:fragment="content">
    <div class="container register-container mt-5">
        <h3 class="page-title mb-4 fw-bold">게시글 등록</h3>

        <!-- 공통 폼 fragment 사용 -->
        <div th:replace="~{fragments/board-form :: boardForm(
                @{/board/register},
                null,
                @{/board/list},
                '등록'
        )}"></div>
    </div>
</th:block>

</body>
</html>
