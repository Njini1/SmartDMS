<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>게시글 수정 | SmartDMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/board-form.css}">
</head>

<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container register-container mt-5">
    <h3 class="page-title mb-4 fw-bold">게시글 수정</h3>

    <!-- board : BoardResponse DTO 사용 -->
    <form th:action="@{|/board/${board.boardId}/update|}" method="post">
        <div class="mb-3">
            <label for="title" class="form-label fw-semibold">제목</label>
            <input type="text" class="form-control" id="title" name="title"
                   th:value="${board.title}" placeholder="게시글 제목을 입력하세요" required>
        </div>

        <div class="mb-3">
            <label for="content" class="form-label fw-semibold">내용</label>
            <textarea id="content" name="content" class="form-control content-box"
                      rows="10" placeholder="게시글 내용을 입력하세요" required
                      th:text="${board.content}"></textarea>
        </div>

        <div class="text-end mt-4">
            <a th:href="@{|/board/${board.boardId}|}" class="btn btn-outline-secondary me-2">취소</a>
            <button type="submit" class="btn btn-main">수정</button>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
