<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{main :: layout(
        '게시글 수정 | SmartDMS',
        ~{::content},
        ~{::extraCss},
        ~{::extraJs}
      )}">

<head></head>
<body>

<!-- 이 페이지 전용 CSS (board-form.css 재사용) -->
<th:block th:fragment="extraCss">
    <link rel="stylesheet" th:href="@{/css/board-form.css}">
</th:block>

<th:block th:fragment="extraJs">
    <!-- 수정 페이지도 별도 JS 없음 -->
</th:block>

<th:block th:fragment="content">
    <div class="container register-container mt-5">
        <h3 class="page-title mb-4 fw-bold">게시글 수정</h3>

        <!-- board : BoardResponse DTO -->
        <div th:replace="~{fragments/board-form :: boardForm(
                @{|/board/${board.boardId}/update|},
                ${board},
                @{|/board/${board.boardId}|},
                '수정'
        )}"></div>
    </div>
</th:block>

</body>
</html>
