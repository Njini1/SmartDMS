<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ko"
      th:replace="~{main :: layout(
        '게시글 목록 | SmartDMS',
        ~{::content},
        ~{::extraCss},
        ~{::extraJs}
      )}">

<head></head>
<body>

<th:block th:fragment="extraCss">
    <link rel="stylesheet" th:href="@{/css/board-list.css}">
</th:block>


<th:block th:fragment="extraJs">

</th:block>

<th:block th:fragment="content">

    <h2 class="board-title text-center mb-4 fw-bold">문서 협업 게시판</h2>

    <div class="text-end mt-4">
        <a th:href="@{/board/registerForm}" class="btn btn-primary px-4">글쓰기</a>
    </div>

    <div class="table-responsive mt-3">
        <table class="table table-hover align-middle text-center">
            <thead class="table-primary">
            <tr>
                <th scope="col" style="width: 10%;">번호</th>
                <th scope="col">제목</th>
                <th scope="col" style="width: 15%;">작성자</th>
                <th scope="col" style="width: 20%;">등록일</th>
                <th scope="col" style="width: 10%;">좋아요</th>
            </tr>
            </thead>

            <tbody>
            <!-- 게시글 목록 출력 -->
            <tr th:each="board : ${boards.content}">
                <td th:text="${board.boardId}"></td>
                <td class="text-start">
                    <a th:href="@{|/board/${board.boardId}|}"
                       class="text-decoration-none text-dark fw-semibold"
                       th:text="${board.title}"></a>
                </td>
                <td th:text="${board.author}"></td>
                <td th:text="${board.createdDate}"></td>
                <td th:text="${board.likeCount}"></td>
            </tr>

            <!-- 게시글이 없을 때 -->
            <tr th:if="${#lists.isEmpty(boards.content)}">
                <td colspan="5" class="text-center py-4 text-muted">
                    등록된 게시글이 없습니다.
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- 페이지네이션 fragment 사용 -->
    <div th:replace="~{fragments/pagination :: boardPagination(${boards})}"></div>

</th:block>

</body>
</html>
