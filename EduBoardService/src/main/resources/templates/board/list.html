<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ko">
<head>
    <meta charset="UTF-8">
    <title>게시판 목록 | SmartDMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/board-list.css}">
</head>

<body>
<!-- 네비게이션 바 포함 -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- 게시글 목록 영역 -->
<div class="container mt-5">
    <h2 class="board-title text-center mb-4 fw-bold">게시글 목록</h2>
    <div class="text-end mt-4">
        <a th:href="@{/board/registerForm}" class="btn btn-primary px-4">글쓰기</a>
    </div>

    <div class="table-responsive">
        <table class="table table-hover align-middle text-center">
            <thead class="table-primary">
            <tr>
                <th scope="col" style="width: 10%;">번호</th>
                <th scope="col">제목</th>
                <th scope="col" style="width: 15%;">작성자</th>
                <th scope="col" style="width: 20%;">등록일</th>
                <th scope="col" style="width: 10%;">좋아요</th>
            </tr>
            </thead>

            <tbody>
            <!-- 게시글 목록 출력 -->
            <tr th:each="board : ${boards.content}">
                <td th:text="${board.boardId}"></td>
                <td class="text-start">
                    <a th:href="@{|/board/${board.boardId}|}"
                       class="text-decoration-none text-dark fw-semibold"
                       th:text="${board.title}"></a>
                </td>
                <td th:text="${board.author}"></td>
                <td th:text="${board.createdDate}"></td>
                <td th:text="${board.likeCount}"></td>
            </tr>

            <!-- 게시글이 없을 때 -->
            <tr th:if="${boards.content.size() == 0}">
                <td colspan="5" class="text-center py-4 text-muted">
                    등록된 게시글이 없습니다.
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- 페이지네이션 -->
    <nav th:if="${boards.totalPages > 1}" class="mt-4">
        <ul class="pagination justify-content-center">

            <!-- 이전 페이지 -->
            <li class="page-item" th:classappend="${boards.first} ? 'disabled'">
                <a class="page-link text-primary fw-bold"
                   th:href="@{/board/list(page=${boards.number - 1})}" aria-label="이전">
                    <span aria-hidden="true">&laquo;</span>
                </a>
            </li>

            <!-- 페이지 번호 -->
            <li class="page-item"
                th:each="pageNum : ${#numbers.sequence(0, boards.totalPages - 1)}"
                th:classappend="${pageNum == boards.number} ? 'active'">
                <a class="page-link"
                   th:text="${pageNum + 1}"
                   th:href="@{/board/list(page=${pageNum})}"></a>
            </li>

            <!-- 다음 페이지 -->
            <li class="page-item" th:classappend="${boards.last} ? 'disabled'">
                <a class="page-link text-primary fw-bold"
                   th:href="@{/board/list(page=${boards.number + 1})}" aria-label="다음">
                    <span aria-hidden="true">&raquo;</span>
                </a>
            </li>
        </ul>
    </nav>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
