<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인 | 싸이웍스</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">

</head>
<body>

<div class="login-card">
    <div class="text-center mb-4 logo d-flex align-items-center justify-content-center">
        <img th:src="@{/images/logo.png}" alt="SmartDMS 로고" class="logo-img me-3">
        <div class="logo-text">
            <h1 class="login-title mb-1">SmartDMS</h1>
            <p class="login-subtitle mb-0 text-end">SMART SERVICE EXPERT GROUP</p>
        </div>
    </div>

<!--    <div th:if="${session.error}" class="alert alert-danger text-center custom-alert" role="alert" th:text="${session.error}"></div>-->
    <div th:if="${message}" class="alert alert-danger text-center custom-alert" role="alert" th:text="${message}"></div>

    <form th:action="@{/users/login}" method="post">
        <div class="mb-3">
            <label for="email" class="form-label">이메일</label>
            <input type="text" class="form-control" id="email" name="username" placeholder="아이디를 입력하세요" required>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">비밀번호</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="비밀번호를 입력하세요" required>
        </div>

        <div class="d-grid mt-4">
            <button type="submit" class="btn btn-login text-white py-2">로그인</button>
        </div>

        <div class="text-center mt-3 links">
            <a th:href="@{/users/register}">회원가입</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
