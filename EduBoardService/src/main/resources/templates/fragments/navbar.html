<nav th:fragment="navbar"
     class="navbar navbar-light shadow-sm py-3 rounded-bottom-4"
     th:data-authenticated="${#authorization.expression('isAuthenticated()')}"
     style="background: linear-gradient(90deg, #e7efff, #f4f8ff); backdrop-filter: blur(10px);">
    <div class="container d-flex justify-content-between align-items-center">

        <!-- 로고 -->
        <a class="navbar-brand d-flex align-items-center fw-bold text-primary" th:href="@{/board/list}">
            <img th:src="@{/images/logo.png}" alt="SmartDMS 로고" style="height: 40px; margin-right: 10px;">
            <span class="fs-4 brand-text">SmartDMS</span>
        </a>

        <!-- 우측 영역 -->
        <div class="d-flex align-items-center">

            <!-- 닉네임(로그인 O) -->
            <span class="fw-semibold text-primary me-3" sec:authorize="isAuthenticated()"
                  th:text="${#authentication.principal.nickname}">
            </span>

            <!-- 로그인 버튼 -->
            <a class="btn btn-gradient text-white px-3 py-2 shadow-sm me-3"
               sec:authorize="!isAuthenticated()"
               th:href="@{/users/login}">
                로그인
            </a>

            <!-- 로그아웃 버튼 -->
            <form th:action="@{/users/logout}" method="post" class="me-3" sec:authorize="isAuthenticated()">
                <button type="submit" class="btn btn-outline-gradient text-primary px-3 py-2 shadow-sm">
                    로그아웃
                </button>
            </form>

            <!-- 햄버거 아이콘 + 드롭다운 -->
            <div class="dropdown">
                <button class="btn btn-outline-gradient px-3 py-2 shadow-sm"
                        type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-list fs-5"></i>
                </button>

                <ul class="dropdown-menu dropdown-menu-end shadow-sm rounded-3">
                    <li><a class="dropdown-item" th:href="@{/board/list}">협업 게시판</a></li>
                    <li><a class="dropdown-item" th:href="@{/document/list}">문서 목록</a></li>
<!--                    <li><a class="dropdown-item" th:href="@{/document/registerForm}">문서 생성</a></li>-->
                    <li>
                        <a class="dropdown-item document-create-link"
                           href="#"
                           data-url="/document/registerForm">
                            문서 생성
                        </a>
                    </li>

                </ul>
            </div>

        </div>
    </div>
</nav>
