<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<body>

<!--
  공통 게시글 폼 fragment
  - actionUrl: form action URL
  - board: 수정 시 사용되는 Board DTO (등록 시 null)
  - cancelUrl: 취소 버튼 이동 경로
  - submitLabel: 버튼 문구 (등록 / 수정 등)
-->
<form th:fragment="boardForm(actionUrl, board, cancelUrl, submitLabel)"
      th:action="${actionUrl}"
      method="post">

    <!-- CSRF 공통 처리 -->
    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}"/>

    <div class="mb-3">
        <label for="title" class="form-label fw-semibold">제목</label>
        <input type="text"
               class="form-control"
               id="title"
               name="title"
               placeholder="게시글 제목을 입력하세요"
               required
               th:value="${board != null} ? ${board.title} : ''">
    </div>

    <div class="mb-3">
        <label for="content" class="form-label fw-semibold">내용</label>
        <textarea id="content"
                  name="content"
                  class="form-control content-box"
                  rows="10"
                  placeholder="게시글 내용을 입력하세요"
                  required
                  th:text="${board != null} ? ${board.content} : ''"></textarea>
    </div>

    <div class="text-end mt-4">
        <a th:href="${cancelUrl}" class="btn btn-outline-secondary me-2">취소</a>
        <button type="submit"
                class="btn btn-main"
                th:text="${submitLabel}">등록</button>
    </div>

</form>

</body>
</html>
