<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{main :: layout(
        ${document.title} + ' | SmartDMS',
        ~{::content},
        ~{::extraCss},
        ~{::extraJs}
      )}">

<head></head>
<body>

<!-- 이 페이지 전용 CSS -->
<th:block th:fragment="extraCss">
    <link rel="stylesheet" th:href="@{/css/document-detail.css}">
</th:block>

<!-- 이 페이지 전용 JS (지금은 없음) -->
<th:block th:fragment="extraJs">
    <!-- 필요 시 문서 상세 전용 JS 추가 -->
</th:block>

<th:block th:fragment="content">

    <!-- 문서 상세 카드 -->
    <div class="document-detail">

        <!-- 상단: 제목 / 부가 정보 -->
        <div class="document-header mb-3">
            <h3 class="document-title" th:text="${document.title}">문서 제목</h3>

            <div class="document-info text-muted">
                <!-- 필요 시 이런 식으로 확장 가능
                <span th:if="${document.author != null}"
                      th:text="'작성자: ' + ${document.author}"></span>
                <span th:if="${document.createdDate != null}">
                    &nbsp;|&nbsp;
                    <span th:text="${document.createdDate}"></span>
                </span>
                -->
                <span>문서 상세 정보</span>
            </div>
        </div>

        <!-- 문서 본문 -->
        <div class="document-content-wrapper mt-4">
            <p class="document-content"
               th:text="${document.content}">
                문서 내용이 들어가는 영역입니다.
            </p>
        </div>

        <!-- 하단 버튼 영역 -->
        <div class="text-end mt-4 button-group">
            <a th:href="@{/document/list}"
               class="btn btn-outline-secondary me-2">
                목록으로
            </a>

            <a th:href="@{|/document/${document.documentId}/updateForm|}"
               class="btn btn-main">
                수정 (새 버전 생성)
            </a>
        </div>

    </div>

</th:block>

</body>
</html>
