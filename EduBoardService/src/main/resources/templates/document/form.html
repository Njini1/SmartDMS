<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>문서 등록</title>

    <style>
        /* 에디터 최소 높이 */
        .ck-editor__editable {
            min-height: 300px;
        }
    </style>
</head>
<body>

<h1>문서 등록</h1>

<form th:action="@{/document/register}" th:object="${form}" method="post">
    <div>
        <label>제목</label><br/>
        <input type="text" th:field="*{title}" required style="width:60%;">
    </div>

    <div style="margin-top: 16px;">
        <label>내용</label><br/>

        <!-- CKEditor 대상 -->
        <textarea id="editor"></textarea>

        <!-- 서버로 보낼 hidden field -->
        <input type="hidden" th:field="*{content}" id="contentHtml"/>
<!--        <input type="hidden" th:field="*{contentHtml}" id="contentHtml"/>-->
    </div>

    <div style="margin-top: 16px;">
        <button type="submit">등록</button>
    </div>
</form>

<!-- CKEditor CDN -->
<script src="https://cdn.ckeditor.com/ckeditor5/40.2.0/classic/ckeditor.js"></script>
<script>
    let editorInstance;

    ClassicEditor
        .create(document.querySelector('#editor'), {
            toolbar: {
                items: [
                    'heading',
                    '|',
                    'bold', 'italic', 'underline', 'strikethrough',
                    '|',
                    'alignment',
                    '|',
                    'link',
                    '|',
                    'bulletedList', 'numberedList',
                    '|',
                    'insertTable', 'blockQuote',
                    '|',
                    'undo', 'redo'
                ],
                shouldNotGroupWhenFull: true
            },

            // ✅ 정렬 옵션
            alignment: {
                options: [ 'left', 'center', 'right', 'justify' ]
            },

            // ✅ 링크 옵션 (외부 링크 새 탭 + rel)
            link: {
                addTargetToExternalLinks: true,
                defaultProtocol: 'https://',
                decorators: {
                    addRelNoopener: {
                        mode: 'automatic',
                        callback: url => /^(https?:)?\/\//.test(url),
                        attributes: {
                            rel: 'noopener noreferrer'
                        }
                    }
                }
            },

            // ✅ 헤딩을 h5까지
            heading: {
                options: [
                    { model: 'paragraph', title: '본문', class: 'ck-heading_paragraph' },
                    { model: 'heading1', view: 'h1', title: '제목 1', class: 'ck-heading_heading1' },
                    { model: 'heading2', view: 'h2', title: '제목 2', class: 'ck-heading_heading2' },
                    { model: 'heading3', view: 'h3', title: '제목 3', class: 'ck-heading_heading3' },
                    { model: 'heading4', view: 'h4', title: '제목 4', class: 'ck-heading_heading4' },
                    { model: 'heading5', view: 'h5', title: '제목 5', class: 'ck-heading_heading5' }
                ]
            },

            table: {
                contentToolbar: [ 'tableColumn', 'tableRow', 'mergeTableCells' ]
            }
        })
        .then(editor => { editorInstance = editor; })
        .catch(error => console.error(error));

    // 폼 submit 시 hidden input에 HTML 저장
    document.querySelector('form').addEventListener('submit', () => {
        document.querySelector('#contentHtml').value = editorInstance.getData();
    });
</script>


</body>
</html>
