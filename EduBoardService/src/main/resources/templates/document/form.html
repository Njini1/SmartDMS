<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{main :: layout(
        '문서 등록 | SmartDMS',
        ~{::content},
        ~{::extraCss},
        ~{::extraJs}
      )}">

<head></head>
<body>

<!-- 이 페이지 전용 CSS -->
<th:block th:fragment="extraCss">
    <!-- 기존 페이지 CSS가 있다면 유지 -->
     <link rel="stylesheet" th:href="@{/css/document-form.css}">

    <!-- CKEditor CSS (self-hosted zip 구조 사용) -->
    <link rel="stylesheet" th:href="@{/ckeditor-custom/style.css}">
    <link rel="stylesheet" th:href="@{/ckeditor-custom/ckeditor5/ckeditor5.css}">

    <style>
        .ck-editor__editable { min-height: 300px; }
    </style>
</th:block>

<!-- 이 페이지 전용 JS -->
<th:block th:fragment="extraJs">

    <!-- importmap: ckeditor5 모듈 경로 매핑 (절대경로 권장) -->
    <script type="importmap">
        {
          "imports": {
            "ckeditor5": "/ckeditor-custom/ckeditor5/ckeditor5.js",
            "ckeditor5/": "/ckeditor-custom/ckeditor5/"
          }
        }
    </script>

    <!-- 생성 화면은 초기값 없음 -->
    <script>
        window.__initialHtml = "";
    </script>

    <!-- CKEditor main.js 로드 (type=module 필수) -->
    <script type="module" src="/ckeditor-custom/main.js"></script>

    <!-- 문서 등록 전용 submit 처리 JS (분리 파일) -->
    <script th:src="@{/js/document-create-form.js}"></script>
</th:block>

<th:block th:fragment="content">

    <h3>문서 등록</h3>

    <form th:action="@{/document/register}"
          th:object="${form}"
          method="post"
          id="docCreateForm">

        <!-- CSRF (main layout에서 자동이면 생략 가능) -->
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}" />

        <div class="mb-3">
            <label class="form-label">제목</label>
            <input type="text"
                   class="form-control"
                   th:field="*{title}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">내용</label>

            <!-- CKEditor mount -->
            <div id="editor"></div>

            <!-- 서버로 실제 전송되는 hidden input -->
            <input type="hidden"
                   id="contentHidden"
                   th:field="*{content}"
                   required>
        </div>

        <div class="text-end mt-3">
            <button type="submit" class="btn btn-main">등록</button>
        </div>
    </form>

</th:block>

</body>
</html>
