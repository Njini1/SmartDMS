<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{main :: layout(
        '문서 등록 | SmartDMS',
        ~{::content},
        ~{::extraCss},
        ~{::extraJs}
      )}">

<head></head>
<body>

<!-- 페이지 전용 CSS -->
<th:block th:fragment="extraCss">
    <link rel="stylesheet" th:href="@{/css/document-form.css}">
</th:block>

<th:block th:fragment="extraJs">
    <!-- 필요 시 JS 추가 -->
</th:block>

<th:block th:fragment="content">

    <div class="document-form-container">
        <h3 class="page-title">문서 등록</h3>

        <form th:action="@{/document/register}"
              th:object="${form}"
              method="post"
              class="document-form">

            <!-- CSRF -->
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />

            <!-- 제목 -->
            <div class="form-group">
                <label for="title" class="form-label">제목</label>
                <input type="text" id="title" th:field="*{title}"
                       class="form-control" required />
            </div>

            <!-- 내용 -->
            <div class="form-group mt-3">
                <label for="content" class="form-label">내용</label>
                <textarea id="content" th:field="*{content}"
                          class="form-control content-box"
                          rows="12" required></textarea>
            </div>

            <!-- 버튼 -->
            <div class="text-end mt-4 button-group">
                <a th:href="@{/document/list}" class="btn btn-outline-secondary me-2">
                    목록으로
                </a>
                <button type="submit" class="btn btn-main">등록</button>
            </div>

        </form>
    </div>

</th:block>

</body>
</html>
