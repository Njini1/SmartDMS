<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{main :: layout(
        '문서 수정 (새 버전 생성) | SmartDMS',
        ~{::content},
        ~{::extraCss},
        ~{::extraJs}
      )}">

<head></head>
<body>

<th:block th:fragment="extraCss">
    <link rel="stylesheet" th:href="@{/css/document-version-form.css}">

    <!-- CKEditor5 CSS (self-hosted zip 구조 사용) -->
    <link rel="stylesheet" th:href="@{/ckeditor-custom/ckeditor5/ckeditor5.css}">
    <link rel="stylesheet" th:href="@{/ckeditor-custom/style.css}">

    <style>
        /* 편집 영역 최소 높이 */
        .ck-editor__editable {
            min-height: 360px;
        }
    </style>
</th:block>

<th:block th:fragment="extraJs">

    <!-- KEditor 모듈 importmap (절대경로 권장) -->
    <script type="importmap">
        {
          "imports": {
            "ckeditor5": "/ckeditor-custom/ckeditor5/ckeditor5.js",
            "ckeditor5/": "/ckeditor-custom/ckeditor5/"
          }
        }
    </script>

    <!-- 초기 데이터(현재 문서 내용)를 에디터에 주입하기 위한 전역 변수 -->
    <script th:inline="javascript">
        window.__initialHtml = /*[[${document.content}]]*/ "";
    </script>

    <!-- CKEditor 빌더가 생성한 main.js 로드 (type="module" 필수) -->
    <script type="module" src="/ckeditor-custom/main.js"></script>

    <script th:src="@{/js/document-version.js}"></script>

</th:block>

<th:block th:fragment="content">

    <div class="document-version-container">

        <!-- 페이지 제목 -->
        <div class="page-header">
            <h3 class="page-title">문서 수정 (새 버전 생성)</h3>
            <p class="page-subtitle">
                현재 문서를 확인하며 제목과 내용을 수정하고, 변경 사유를 함께 남겨주세요.
            </p>
        </div>

        <!-- 에러 메시지 (동시성 충돌 등) -->
        <div th:if="${errorMessage}" class="alert alert-danger version-alert" role="alert"
             th:text="${errorMessage}">
            동시성 충돌 등 에러 메시지가 표시됩니다.
        </div>

        <!-- 현재 문서 정보 -->
        <section class="current-document-section">
            <div class="section-header">
                <h5 class="section-title">현재 문서 정보</h5>
                <span class="badge-version">현재 버전</span>
            </div>

            <div class="meta-info">
                <div class="meta-item">
                    <span class="meta-label">문서 ID</span>
                    <span class="meta-value" th:text="${document.documentId}">1</span>
                </div>

                <div class="meta-item">
                    <span class="meta-label">버전 락(잠금 버전)</span>
                    <span class="meta-value" th:text="${document.lockVersion}">0</span>
                </div>
            </div>

            <div class="current-title">
                <span class="meta-label">현재 제목</span>
                <p class="current-title-text" th:text="${document.title}">
                    문서 제목입니다.
                </p>
            </div>

            <div class="current-content-wrapper">
                <span class="meta-label">현재 내용</span>

                <!-- HTML 문서라면 pre 말고 div로 출력하는 게 맞음 -->
                <!-- 주의: th:utext는 XSS 위험이 있으니 "내부 직원 입력 + 서버 sanitize" 전제에서만 사용 -->
                <div class="current-content">
                    <div th:utext="${document.content}">
                        기존 문서 내용이 이 영역에 표시됩니다.
                    </div>
                </div>
            </div>
        </section>

        <hr class="divider"/>

        <!-- 새 버전 작성 폼 -->
        <section class="new-version-section">
            <div class="section-header">
                <h5 class="section-title">새 버전 작성</h5>
                <span class="badge-version new">새 버전</span>
            </div>

            <form th:action="@{|/document/${document.documentId}/update|}"
                  method="post"
                  class="version-form">

                <!-- CSRF -->
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}"/>

                <!-- 동시성 체크용 hidden 값 -->
                <input type="hidden" name="documentId"
                       th:value="${document.documentId}"/>
                <input type="hidden" name="lockVersion"
                       th:value="${document.lockVersion}"/>

                <!-- 새 제목 -->
                <div class="mb-3">
                    <label for="newTitle" class="form-label">새 제목</label>
                    <input type="text"
                           id="newTitle"
                           name="newTitle"
                           class="form-control"
                           th:value="${document.title}"
                           placeholder="새 버전의 제목을 입력하세요"
                           required/>
                </div>

                <!-- 새 내용: CKEditor 대상 -->
                <div class="mb-3">
                    <label class="form-label">새 내용</label>

                    <!-- 에디터 mount -->
                    <div id="editor" class="content-box"></div>

                    <!-- 서버로 실제 전송되는 hidden input (name=newContent 유지) -->
                    <input type="hidden" id="newContentHidden" name="newContent" required>
                    <div class="form-text">
                        문서 내용은 HTML 형식으로 저장됩니다.
                    </div>
                </div>

                <!-- 변경 사유 -->
                <div class="mb-3">
                    <label for="changeReason" class="form-label">변경 사유</label>
                    <input type="text"
                           id="changeReason"
                           name="changeReason"
                           class="form-control"
                           placeholder="예: 오타 수정, 항목 추가, 정책 변경 반영 등"/>
                    <div class="form-text">
                        변경 사유를 남기면 버전 이력 관리에 도움이 됩니다. (선택)
                    </div>
                </div>

                <!-- 버튼 영역 -->
                <div class="text-end mt-4 button-group">
                    <a th:href="@{|/document/${document.documentId}|}"
                       class="btn btn-outline-secondary me-2">
                        문서 상세로 돌아가기
                    </a>
                    <button type="submit" class="btn btn-main">
                        새 버전으로 저장
                    </button>
                </div>

            </form>
        </section>

    </div>

</th:block>

</body>
</html>
