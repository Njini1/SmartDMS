<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{main :: layout(
        '문서 수정 (새 버전 생성) | SmartDMS',
        ~{::content},
        ~{::extraCss},
        ~{::extraJs}
      )}">

<head></head>
<body>

<!-- 이 페이지 전용 CSS -->
<th:block th:fragment="extraCss">
    <link rel="stylesheet" th:href="@{/css/document-version-form.css}">
</th:block>

<th:block th:fragment="extraJs">
    <!-- 버전 수정 페이지 전용 JS 필요하면 여기 -->
</th:block>

<th:block th:fragment="content">

    <div class="document-version-container">

        <!-- 페이지 제목 -->
        <div class="page-header">
            <h3 class="page-title">문서 수정 (새 버전 생성)</h3>
            <p class="page-subtitle">
                현재 문서를 확인하며 제목과 내용을 수정하고, 변경 사유를 함께 남겨주세요.
            </p>
        </div>

        <!-- 에러 메시지 (동시성 충돌 등) -->
        <div th:if="${errorMessage}" class="alert alert-danger version-alert" role="alert"
             th:text="${errorMessage}">
            동시성 충돌 등 에러 메시지가 표시됩니다.
        </div>

        <!-- 현재 문서 정보 -->
        <section class="current-document-section">
            <div class="section-header">
                <h5 class="section-title">현재 문서 정보</h5>
                <span class="badge-version">현재 버전</span>
            </div>

            <div class="meta-info">
                <div class="meta-item">
                    <span class="meta-label">문서 ID</span>
                    <span class="meta-value" th:text="${document.documentId}">1</span>
                </div>

                <!-- 작성자 보여주기
                <div class="meta-item">
                    <span class="meta-label">작성자</span>
                    <span class="meta-value" th:text="${document.author}">홍길동</span>
                </div>
                -->

                <!-- 잠금 버전도 참고용으로 보여줄 수 있음 -->
                <div class="meta-item">
                    <span class="meta-label">버전 락(잠금 버전)</span>
                    <span class="meta-value" th:text="${document.lockVersion}">0</span>
                </div>
            </div>

            <div class="current-title">
                <span class="meta-label">현재 제목</span>
                <p class="current-title-text" th:text="${document.title}">
                    문서 제목입니다.
                </p>
            </div>

            <div class="current-content-wrapper">
                <span class="meta-label">현재 내용</span>
                <div class="current-content">
                    <pre th:text="${document.content}">
기존 문서 내용이 이 영역에 표시됩니다.
                    </pre>
                </div>
            </div>
        </section>

        <hr class="divider"/>

        <!-- 새 버전 작성 폼 -->
        <section class="new-version-section">
            <div class="section-header">
                <h5 class="section-title">새 버전 작성</h5>
                <span class="badge-version new">새 버전</span>
            </div>

            <form th:action="@{|/document/${document.documentId}/update|}"
                  method="post"
                  class="version-form">

                <!-- CSRF -->
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}" />

                <!-- 동시성 체크용 hidden 값 -->
                <input type="hidden" name="documentId"
                       th:value="${document.documentId}"/>
                <input type="hidden" name="lockVersion"
                       th:value="${document.lockVersion}"/>

                <!-- 새 제목 -->
                <div class="mb-3">
                    <label for="newTitle" class="form-label">새 제목</label>
                    <input type="text"
                           id="newTitle"
                           name="newTitle"
                           class="form-control"
                           th:value="${document.title}"
                           placeholder="새 버전의 제목을 입력하세요"
                           required/>
                </div>

                <!-- 새 내용 -->
                <div class="mb-3">
                    <label for="newContent" class="form-label">새 내용</label>
                    <textarea id="newContent"
                              name="newContent"
                              class="form-control content-box"
                              rows="12"
                              th:text="${document.content}"
                              placeholder="수정된 내용을 입력하세요"
                              required></textarea>
                </div>

                <!-- 변경 사유 -->
                <div class="mb-3">
                    <label for="changeReason" class="form-label">변경 사유</label>
                    <input type="text"
                           id="changeReason"
                           name="changeReason"
                           class="form-control"
                           placeholder="예: 오타 수정, 항목 추가, 정책 변경 반영 등"/>
                    <div class="form-text">
                        변경 사유를 남기면 버전 이력 관리에 도움이 됩니다. (선택)
                    </div>
                </div>

                <!-- 버튼 영역 -->
                <div class="text-end mt-4 button-group">
                    <a th:href="@{|/document/${document.documentId}|}"
                       class="btn btn-outline-secondary me-2">
                        문서 상세로 돌아가기
                    </a>
                    <button type="submit" class="btn btn-main">
                        새 버전으로 저장
                    </button>
                </div>

            </form>
        </section>

    </div>

</th:block>

</body>
</html>
